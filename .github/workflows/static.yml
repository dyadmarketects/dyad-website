# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build blog (pages, index, RSS feed, sitemap, service page links)
        run: python3 _tools/blog.py && python3 _tools/site_chrome.py
      - name: SEO check (warnings only, never blocks the deploy)
        continue-on-error: true
        run: python3 _tools/seo_check.py
      - name: Save the live sitemap (IndexNow compares against it after deploy)
        continue-on-error: true
        run: curl -fsSL --max-time 20 https://dyadgrow.com/sitemap.xml -o "$RUNNER_TEMP/live-sitemap.xml" || true
      - name: Copy the public site (leaves out blog sources, tools and notes)
        run: |
          mkdir -p ../_site
          tar --exclude='./.git' --exclude='./.github' --exclude='./_blog' --exclude='./_tools' --exclude='./CLAUDE.md' -cf - . | tar -xf - -C ../_site
          mv ../_site ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Tell Bing about new and updated pages (IndexNow)
        continue-on-error: true
        run: sleep 60 && python3 _tools/indexnow.py "$RUNNER_TEMP/live-sitemap.xml"
